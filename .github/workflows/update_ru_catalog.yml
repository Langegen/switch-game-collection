name: Update Game Catalogs & 72h Diff (Every 4 Hours)

on:
  schedule:
    # Runs every 4 hours starting from 01:00 MSK / UTC+3 (02:00, 06:00, 10:00, 14:00, 18:00, 22:00 UTC)
    - cron: '0 2,6,10,14,18,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogs-update
  cancel-in-progress: false

jobs:
  update-catalogs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pillow requests

      - name: Download covers for new releases
        run: python scripts/download_covers.py

      - name: Run RU catalog build script
        run: python scripts/build_ru_catalog.py

      - name: Run Multi-Language Catalogs build script (EN, ES, FR, DE, IT, PT-BR, ZH-Hans)
        run: python scripts/build_catalogs.py --lang all

      - name: Generate unified 72-hour catalog diff
        run: python scripts/generate_catalog_diff.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update localized game catalogs, covers, and 72h catalog diff"
          file_pattern: "*_catalog.json catalog_diff.json diff_history.json scripts/translations_cache*.json covers/*.webp"

