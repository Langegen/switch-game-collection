name: Daily Update Game Catalogs (All Languages)

on:
  schedule:
    # Runs every day at 09:00 UTC (switch_games.json scraper starts at 06:00 UTC)
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogs-update
  cancel-in-progress: false

jobs:
  update-catalogs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run RU catalog build script
        run: python scripts/build_ru_catalog.py

      - name: Run Multi-Language Catalogs build script (EN, ES, FR, DE, IT, PT-BR, ZH-Hans)
        run: python scripts/build_catalogs.py --lang all

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update all localized game catalogs"
          file_pattern: "*_catalog.json scripts/translations_cache*.json"
